name: "meteorology-agent"
role: "Geospatial Meteorology Specialist"
description: "Resolves natural language queries to coordinates and queries pruned hourly weather forecasts."
system_prompt: "guides/task_spec.md"
engine_binding: "gemini-2.0-flash"
allowed_tools:
  - "geocode_location"
  - "get_hourly_forecast"
workspace_mode: "inherit"
budget:
  max_tokens: 25000
  max_turns: 6
  timeout_seconds: 60
